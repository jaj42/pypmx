[project]
name = "pmxpy"
version = "0.0.1"
description = "Pharmacometric models and algorithms"
authors = [{ name = "Jona JOACHIM", email = "jona@joachim.cc" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "ISC"
dependencies = [
    "scipy>=1.12.0,<2",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "pint>=0.23,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E731"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
