[project]
name = "pypmx"
version = "0.0.1"
description = "Pharmacometric models and algorithms"
authors = [{ name = "Jona JOACHIM", email = "jona@joachim.cc" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "ISC"
dependencies = [
    "scipy>=1.12.0,<2",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "pint>=0.23,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["E731"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ty>=0.0.108",
]

[tool.ty.environment]
python-version = "3.10"
root = ["src", "tests"]

[tool.ty.src]
# Legacy modules, removed or rewritten during the PK API unification (plan.md
# steps 3-5). Do not add new files here.
exclude = [
    "src/pypmx/drugs/alfentanil.py",
    "src/pypmx/drugs/cefazolin.py",
    "src/pypmx/drugs/sufentanil.py",
]
